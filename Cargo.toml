[workspace]
members = ["."]
resolver = "2"

[package]
name = "sevenzippy"
version = "0.0.1"
edition = "2021"
description = "Pure-Rust 7z archive implementation. Umbrella over the zippy family of codec crates."
license = "Zlib"
repository = "https://github.com/JackDanger/7zippy"
authors = ["Jack Danger Canty"]
build = "build.rs"
default-run = "7zippy"

[lib]
name = "sevenzippy"
path = "src/lib.rs"

[[bin]]
name = "7zippy"
path = "src/main.rs"

[dependencies]
thiserror = "1"
crc32fast = "1"

# External codec sub-crates (feature-gated).
lazippy     = { version = "0.0.1", path = "../lazippy",   optional = true }
bzippy2     = { version = "0.0.1", path = "../bzippy2",   optional = true }
xzippy      = { version = "0.1.0", path = "../xzippy",    optional = true }
# gzippy 0.8 exposes raw-deflate primitives (deflate_encode/deflate_decode),
# Deflate64 decode (decompress_deflate64), and Deflate64 encode
# (compress_deflate64). Both the deflate and deflate64 features activate this
# single crate; Cargo deduplicates the dependency.
gzippy      = { version = "0.8",                           optional = true }
bcjzippy    = { version = "0.0.3", path = "../bcjzippy",  optional = true }
aeszippy    = { version = "0.0.3", path = "../aeszippy",  optional = true }
# BCJ (simple 6-arch branch filter) is folded in-tree; lzma-rust2 provides
# the filter backend. BCJ2 (x86 4-stream) stays in bcjzippy.
lzma-rust2  = { version = "0.16", features = ["encoder"], optional = true }

# In-tree codec backends (formerly separate sub-crates, folded in).
ppmd-rust   = { version = "1.4",                             optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["lzma", "lzma2", "deflate", "deflate64", "bzip2", "delta", "ppmd", "bcj", "bcj2", "aes"]
lzma      = ["dep:lazippy"]
deflate   = ["dep:gzippy"]
deflate64 = ["dep:gzippy"]     # encode + decode via gzippy 0.8
bzip2     = ["dep:bzippy2"]
delta     = []                  # Delta filter — pure-Rust, in-tree (no external dep)
ppmd      = ["dep:ppmd-rust"]  # PPMd — in-tree, backed by ppmd-rust
bcj       = ["dep:lzma-rust2"] # BCJ (6-arch branch filter) — in-tree via lzma-rust2
lzma2     = ["dep:xzippy"]
bcj2      = ["dep:bcjzippy", "lzma"]  # BCJ2 x86 4-stream filter; requires LZMA for inner stream
aes       = ["dep:aeszippy"]          # AES-256-CBC decrypt + encrypt

[profile.release]
lto           = "fat"
codegen-units = 1
opt-level     = 3
strip         = true

[[bench]]
name = "archive_read"
harness = false

[[bench]]
name = "archive_write"
harness = false

[[bench]]
name = "container_parse"
harness = false
